# The site is plain HTML, so there is nothing to build yet.
[build]
  publish = "."

# New updates should show straight away
[[headers]]
  for = "/updates.json"
  [headers.values]
    Cache-Control = "no-cache"

# Keep the admin screen out of Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
